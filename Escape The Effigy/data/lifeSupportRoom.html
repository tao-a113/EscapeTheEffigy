<!DOCTYPE html>
<html>

<head>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="javascript.js"></script>
    <link rel="stylesheet" href="stylesheet.css">

    <title>The Effigy - Escape Room v1.0</title>
</head>

<style>
#lifeSupportBody  {
  background-image: url("images/lifeSupport.jpg");
  background-repeat: no-repeat;
  position: absolute;
  background-size: cover;
  height: 770px; width:1250px;
}
.buttons:focus {
  outline: none;
  box-shadow: none;
}

.buttons:hover  {
    -webkit-filter: drop-shadow(2px 1px 0 yellow)
    				  drop-shadow(-1px -1px 0 yellow);
    filter: drop-shadow(2px 1px 0 yellow)
  		  drop-shadow(-1px -1px 0 yellow);
}
</style>

<script>

$( document ).ready(function() {
	$('#button1').click(function(){
		document.getElementById("roomResponseText").innerText = "";
		var text = "There is a plant growing in here. The display says its called a Bissalium.";
		setTypeWriter();
		typeWriter (text);
		popupWindow = window.open(
			"popups/popupFix02_trees.html",'popUpWindow','height=650,width=700,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
	});
	
	$('#button2').click(function(){
		document.getElementById("roomResponseText").innerText = "";
		var text = "This computer controls the main oxygen tanks. It has been completely damaged in the attack. Only the plants can produce any excess.";
		setTypeWriter();
		typeWriter (text);
	});

	$('#button3').click(function(){
		document.getElementById("roomResponseText").innerText = "";
		var text = "The plant can be fed from here";
		setTypeWriter();
		typeWriter (text);
		popupWindow = window.open(
			"popups/popupFix02_treeFeed.html",'popUpWindow','height=650,width=700,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
	});
});
</script>
<body>
	<div id="lifeSupportBody">
		<input id="button1" class="buttons" type="image" src="images/lifeSupportButton1.png" style="top:112px; left:756px; height:430px; width:295px; position:absolute"/>
		<input id="button3" class="buttons" type="image" src="images/lifeSupportButton3.png" style="top:535px; left:863px; height:65px; width:173px; position:absolute;"/>
	</div>

	
	<div id="roomDescription" class="roomDescription">
		<p id="roomDescriptionText" style="width:370px; height:300px; margin-left:20px; margin-top:30px; top:47px; left:48px; position:relative;">
			You are in the life support room. The main oxygen tanks have been hit and are not repairable. The room does contain some plants that could be directed to areas of the ship.
		</p>
	</div>

	<br><br>

	<div id="roomResponses" class="roomResponses">
		<p id="roomResponseText" style="width:360px; height:300px; margin-left:20px; margin-top:30px; top:80px; left:63px; position:relative;"></p>
	</div>
	
	<input id="button2" class="buttons" type="image" src="images/lifeSupportButton2.png" style="top:400px; left:1200px; height:50px; width:60px; position:absolute"/>
	
</body>
	<div class="console">
		<input style="margin-top:40px; margin-left:40px" type="text" class="consoleText">
		<input style="margin-top:40px;" type="submit" value="Update System" class="consoleButton">
		<input style="margin-top:10px; height:70px; width:600px; margin-left:70px" type="textarea" id="consoleArea">
	</div>
</html>
