<!DOCTYPE html>
<html>

<head>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="javascript.js"></script>
    <link rel="stylesheet" href="stylesheet.css">

    <title>The Effigy - Escape Room v1.0</title>
</head>

<style>
#shuttleBody  {
  background-image: url("images/shuttle.jpg");
  background-repeat: no-repeat;
  position: absolute;
  background-size: cover;
  height: 770px; width:1250px;
}
.buttons:focus {
  outline: none;
  box-shadow: none;
}

.buttons:hover  {
    -webkit-filter: drop-shadow(2px 1px 0 yellow)
    				  drop-shadow(-1px -1px 0 yellow);
    filter: drop-shadow(2px 1px 0 yellow)
  		  drop-shadow(-1px -1px 0 yellow);
}
</style>

<script>
$( document ).ready(function() {

	$('#button1').click(function(){
		document.getElementById("roomResponseText").innerText = "";
		var text = "Main shuttle controls";
		setTypeWriter();
		typeWriter (text);
		popupWindow = window.open(
			"popups/popupTakeOff.html",'popUpWindow','height=600,width=800,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
	});

	$('#button2').click(function(){
		document.getElementById("roomResponseText").innerText = "";
		var text = "The shows the status of the shuttle.";
		setTypeWriter();
		typeWriter (text);
		popupWindow = window.open(
			"popups/popupToDo.html",'popUpWindow','height=600,width=800,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
	});
});
</script>

<body>
	<div id="shuttleBody">
		<input id="button1" class="buttons" type="image" src="images/shuttleButton1.png" style="top:315px; left:545px; height:75; width:250px; position:absolute"/>
		<input id="button2" class="buttons" type="image" src="images/shuttleButton2.png" style="top:155px; left:560px; height:75px; width:230px; position:absolute"/>
	</div>

	<div id="roomDescription" class="roomDescription">
		<p id="roomDescriptionText" style="width:370px; height:300px; margin-left:20px; margin-top:30px; top:47px; left:48px; position:relative;">
			You are in the shuttle. Make sure everything is ready for blast off!
		</p>
	</div>

	<br><br>

	<div id="roomResponses" class="roomResponses">
		<p id="roomResponseText" style="width:360px; height:300px; margin-left:20px; margin-top:30px; top:80px; left:63px; position:relative;"></p>
	</div>
</body>
	<div class="console">
		<input style="margin-top:40px; margin-left:40px" type="text" class="consoleText">
		<input style="margin-top:40px;" type="submit" value="Update System" class="consoleButton">
		<input style="margin-top:10px; height:70px; width:600px; margin-left:70px" type="textarea" id="consoleArea">
	</div>
</html>
