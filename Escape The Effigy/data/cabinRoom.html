<!DOCTYPE html>
<html>

<head>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="javascript.js"></script>
    <link rel="stylesheet" href="stylesheet.css">

    <title>The Effigy - Escape Room v1.0</title>
</head>

<style>
#cabinBody  {
  background-image: linear-gradient( rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.9) ), url("images/cabin2.png");
  background-repeat: no-repeat;
  height: 850px; width: 1250px;
  background-size: cover;
  position: absolute;
}

.buttons:focus {
  outline: none;
  box-shadow: none;
}

.buttons:hover  {
    -webkit-filter: drop-shadow(2px 1px 0 yellow)
    				  drop-shadow(-1px -1px 0 yellow);
    filter: drop-shadow(2px 1px 0 yellow)
  		  drop-shadow(-1px -1px 0 yellow);
}

</style>

<script>

$( document ).ready(function() {
	$('#button3').click(function(){
		document.getElementById("roomResponseText").innerText = "";
		var text = "Complete the circuit to switch on the lights.";
		setTypeWriter();
		typeWriter (text);
		popupWindow = window.open(
			"popups/popupLightingWires.html",'popUpWindow','height=455,width=430,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
	});
	$('#button1').click(function(){
	
		if (checkButton ($(this))) {
			return;
		}
	
		document.getElementById("roomResponseText").innerText = "";
		var text = "A bookshelf";
		setTypeWriter();
		typeWriter (text);
		popupWindow = window.open(
			"popups/popupBooks1.html",'popUpWindow','height=600,width=800,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
	});
	$('#button2').click(function(){
	
		if (checkButton ($(this))) {
			return;
		}
	
		document.getElementById("roomResponseText").innerText = "";
		var text = "It seems like a audio calibrator";
		setTypeWriter();
		typeWriter (text);
		popupWindow = window.open(
			"popups/popupRadio_cab.html",'popUpWindow','height=600,width=800,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
	});
	$('#button4').click(function(){
		
		if (checkButton ($(this))) {
			return;
		}
		
		var gotScanner = localStorage.getItem("handScanner");
		if (gotScanner == "true") {
			localStorage.setItem("secretFound", "true");
			document.getElementById("roomResponseText").innerText = "";
			var text = "The hand scanner reveals a hidden picture";
			setTypeWriter();
			typeWriter (text);
			popupWindow = window.open(
				"popups/popupSecret.html",'popUpWindow','height=730,width=800,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
			)
			return;
		}
		
		document.getElementById("roomResponseText").innerText = "";
		var text = "Pictures of friends and family hang here";
		setTypeWriter();
		typeWriter (text);

	});
	
	function checkButton(obj) {
		if (obj.hasClass("darkenedButtons")){
			document.getElementById("roomResponseText").innerText = "";
			var text = "It's too dark to use this right now.";
			setTypeWriter();
			typeWriter (text);
			return true;
		}
	}
});
</script>
<body>
	<div id="cabinBody">
		<input id="button1" class="buttons darkenedButtons" type="image" src="images/cabinButton1.png" style="width:150px; height:75px; margin-left:20px; margin-top:20px; top:135px; left:580px; position:absolute;"/>
		<input id="button2" class="buttons darkenedButtons" type="image" src="images/cabinButton2.png" style="width:250px; height:100px; margin-left:20px; margin-top:20px; top:240px; left:17px; position:absolute"/>
		<input id="button3" class="buttons darkenedButtons" type="image" src="images/cabinButton3.png" style="width:90px; height:222px; margin-left:20px; margin-top:20px; top:89px; left:332px; position:absolute"/>
		<input id="button4" class="buttons darkenedButtons" type="image" src="images/cabinButton4.png" style="width:65px; height:135px; margin-left:20px; margin-top:20px; top:155px; left:775px; position:absolute"/>
	</div>

	<div id="roomDescription" class="roomDescription">

		<p id="roomDescriptionText" style="width:370px; height:300px; margin-left:20px; margin-top:30px; top:47px; left:48px; position:relative;">
			You are in the cabin. There are a few personal effects in here.
		</p>
	</div>

	<br><br>

	<div id="roomResponses" class="roomResponses">
		<p id="roomResponseText" style="width:360px; height:300px; margin-left:20px; margin-top:30px; top:80px; left:63px; position:relative;"></p>
	</div>
</body>
	<div class="console">
		<input style="margin-top:40px; margin-left:40px" type="text" class="consoleText">
		<input style="margin-top:40px;" type="submit" value="Update System" class="consoleButton">
		<input style="margin-top:10px; height:70px; width:600px; margin-left:70px" type="textarea" id="consoleArea">
	</div>
</html>
