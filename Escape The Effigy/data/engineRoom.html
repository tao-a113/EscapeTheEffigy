<!DOCTYPE html>
<html>

<head>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="javascript.js"></script>
    <link rel="stylesheet" href="stylesheet.css">

    <title>The Effigy - Escape Room v1.0</title>
</head>

<style>
#engineBody  {
  background-image: linear-gradient( rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.9) ), url("images/engine.jpg");
  background-repeat: no-repeat;
  position: absolute;
  background-size: cover;
  height: 770px; width:1250px;
}
.buttons:focus {
  outline: none;
  box-shadow: none;
}

.buttons:hover  {
    -webkit-filter: drop-shadow(2px 1px 0 yellow)
    				  drop-shadow(-1px -1px 0 yellow);
    filter: drop-shadow(2px 1px 0 yellow)
  		  drop-shadow(-1px -1px 0 yellow);
}
</style>

<script>
$( document ).ready(function() {
	$('#button1').click(function(){

		document.getElementById("roomResponseText").innerText = "";
		var text = "Complete the circuit to switch on the lights.";
		setTypeWriter();
		typeWriter (text);

		popupWindow = window.open(
			"popups/popupLightingWires.html",'popUpWindow','height=455,width=430,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
	});
	$('#button2').click(function(){

		if (checkButton ($(this))) {
			return;
		}
		var gotTools = localStorage.getItem("gotTools");
		if (gotTools == "true") {
			localStorage.setItem("handScanner", "true");
			document.getElementById("roomResponseText").innerText = "";
			var text = "You use the tools from fixing the shuttle room to hack into the toolbox. The toolbox contains a hand scanner.";
			setTypeWriter();
			typeWriter (text);
			return;
		}
		document.getElementById("roomResponseText").innerText = "";
		var text = "A toolbox";
		setTypeWriter();
		typeWriter (text);

	});
	$('#button3').click(function(){

		if (checkButton ($(this))) {
			return;
		}
	
		document.getElementById("roomResponseText").innerText = "";
		var text = "The ships engine. Seriel number - 112110090. Model number - B97-X114. The instructions seem to be missing.";
		setTypeWriter();
		typeWriter (text);

		popupWindow = window.open(
			"popups/popupEngine_eng.html",'popUpWindow','height=550,width=600,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
	});
	
	function checkButton(obj) {
		if (obj.hasClass("darkenedButtons")){
			document.getElementById("roomResponseText").innerText = "";
			var text = "It's too dark to use this right now.";
			setTypeWriter();
			typeWriter (text);
			return true;
		}
	}
	
});
</script>

<body>
	<div id="engineBody">
		<input id="button1" class="buttons darkenedButtons" type="image" src="images/engineButton1.png" style="top:350px; left:225px; width:100px; height:174px; position:absolute"/>
		<input id="button2" class="buttons darkenedButtons" type="image" src="images/engineButton2.png" style="width:175px; height:220px; top:565px; left:985px; position:absolute"/>
		<input id="button3" class="buttons darkenedButtons" type="image" src="images/engineButton3.png" style="width:540px; height:440px; top:315px; left:400px; position:absolute"/>
	</div>

	<div id="roomDescription" class="roomDescription">
		<p id="roomDescriptionText" style="width:370px; height:300px; margin-left:20px; margin-top:30px; top:47px; left:48px; position:relative;">
			You are on the main engine room.
		</p>
	</div>

	<br><br>

	<div id="roomResponses" class="roomResponses">
		<p id="roomResponseText" style="width:360px; height:300px; margin-left:20px; margin-top:30px; top:80px; left:63px; position:relative;"></p>
	</div>
</body>
	<div class="console">
		<input style="margin-top:40px; margin-left:40px" type="text" class="consoleText">
		<input style="margin-top:40px;" type="submit" value="Update System" class="consoleButton">
		<input style="margin-top:10px; height:70px; width:600px; margin-left:70px" type="textarea" id="consoleArea">
	</div>
</html>
