<script>

window.onload = function(){

var sounds = [];
var phase = 1;
var off = true;

	$('#record').click(function(){
		if (off) {
			$(this).attr('src','../images/recordButtonOn.png');
		} else {
			$(this).attr('src','../images/recordButtonOff.png');
		}
		off = !off;
	});
	
	$('.button').click(function(){
		var id = $(this).attr('id');
		var beep;
				
		switch (id) {
			case ("button0") : beep = new Audio('../sounds/beep0.wav'); break;
			case ("button1") : beep = new Audio('../sounds/beep1.wav'); break;
			case ("button2") : beep = new Audio('../sounds/beep2.wav'); break;
			case ("button3") : beep = new Audio('../sounds/beep3.wav'); break;
			case ("button4") : beep = new Audio('../sounds/beep4.wav'); break;
			case ("button5") : beep = new Audio('../sounds/beep5.wav'); break;
			case ("button6") : beep = new Audio('../sounds/beep6.wav'); break;
			case ("button7") : beep = new Audio('../sounds/beep7.wav'); break;
			case ("button8") : beep = new Audio('../sounds/beep8.wav'); break;
			case ("button9") : beep = new Audio('../sounds/beep9.wav'); break;
			case ("button10") : beep = new Audio('../sounds/beep10.wav'); break;
			case ("button11") : beep = new Audio('../sounds/beep11.wav'); break;
			case ("button12") : beep = new Audio('../sounds/beep12.wav'); break;
			case ("button13") : beep = new Audio('../sounds/beep13.wav'); break;
			case ("button14") : beep = new Audio('../sounds/beep14.wav'); break;
		}
		beep.play();
		if (!off) {
			addSound (id);
		}
	});

	function addSound (id) {
	
		var num = id.substr(6);
		var column = $('<td id='+num+' style="width:50px;">'+ num +'</td>'); 
		
		$('#soundTable tr').append(column);
		sounds.push (num);
	}
	
	$('#play').click(function(){
	
		var audio = new Audio();
		i = 0;
		var playlist = new Array();

		for (j=0; j<sounds.length; j++) {		
			var sound = sounds[j];
			playlist.push ('../sounds/beep'+sound+'.wav');
		}
		
		audio.onended = (event) => {
		
			if (i < playlist.length) {
				i = ++i;
				audio.src = playlist[i];
				audio.play();
			}
			if (i == playlist.length) {
			// 0 9 8 9 10 6 8 7
				if (sounds[0] == 0 && sounds[1] == 9 && sounds[2] == 8 && sounds[3] == 9 && sounds[4] == 10 && sounds[5] == 7 && sounds.length == 6) {
					
					$('#answer').show ();	
					localStorage.setItem("isSuitsReady", "true");
					
				}
			}
		};
		
		audio.loop = false;
		audio.src = playlist[0];
		audio.play();
	});
	
	$('#clear').click(function(){
		var i;
		for (i = 0; i<sounds.length; i++) {
			var sound = sounds[i];
			$('#soundTable tr td#' + sound).remove();    
		}
		sounds = [];
	});
	
	function nextPhase () {
		$('.button').show ();
		$('#keypad').show ();
		$('#clear').show ();
		$('#play').show ();
		$('#soundTable').show ();
		$('#record').show ();
		sounds = [];
		
		$('#musicPanel1').hide ();
		$('.button2').hide ();	
		$('.button3').hide ();	
		$('#next').hide ();
		$('#sub').hide ();
	}
	
		$('.button2').click(function(){
		
			var audio = new Audio();
			i = 0;
			var playlist = new Array();

			
			playlist.push ('../sounds/beep8.wav');
			playlist.push ('../sounds/beep9.wav');
			playlist.push ('../sounds/beep7.wav');
			playlist.push ('../sounds/beep0.wav');
			playlist.push ('../sounds/beep4.wav');
		
			audio.onended = (event) => {
		
				if (i < playlist.length) {
					i = ++i;
					audio.src = playlist[i];
					audio.play();
				}
			};
			audio.loop = false;
			audio.src = playlist[0];
			audio.play();
		});
	
	$('#sub').click(function(){
		var num1 = $('#num1').val ();
		var num2 = $('#num2').val ();
		var num3 = $('#num3').val ();
		var num4 = $('#num4').val ();
		
		if (num1 == "1" && num2 == "0" && num3 == "8" && num4 == "1") {
			nextPhase ();
		}
		
	});
	
};
</script>
