<style>
@font-face { font-family: Digital7; src: url('../digital-7/digital-7.ttf'); } 
@keyframes slide {
  from { left: 100%;}
  to { left: -100%;}
}
@-webkit-keyframes slide {
  from { left: 100%;}
  to { left: -100%;}
}

#marquee { 
  color:red; 
  background:black;
  width:100%;
  height:120px;
  line-height:120px;
  overflow:hidden;
  position:relative;
}

#text {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:120px;
  font-size:30px;
  animation-name: slide;
  animation-duration: 10s;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  -webkit-animation-name: slide;
  -webkit-animation-duration: 10s;
  -webkit-animation-timing-function:linear;
  -webkit-animation-iteration-count: infinite;
}
</style>
<script>

// Knob angle
var angle = 0;
var angle2 = 0;


var attempt;
var correctAnswers;

window.onload = function(){

attempt = 1;
correctAnswers = 0;

	$('.button1').click(function(){
		$(this).find( '#image1' ).attr('src','../images/UIBlueButtonSelected.png');
		checkCorrectSequence ($(this));
	});
	$('.button2').click(function(){
		$(this).find( '#image1' ).attr('src','../images/UIOrangeButtonSelected.png');
		checkCorrectSequence ($(this));
	});
	$('#button1').click(function(){
		angle = 0;
		angle2 = 0;
		$('.button1').find( '#image1' ).attr('src','../images/UIBlueButton.png');
		$('.button2').find( '#image1' ).attr('src','../images/UIOrangeButton.png');
		correctAnswers = 0;
		attempt = 1;
	});

	function checkCorrectSequence(thisObj) {

	console.log (thisObj.data("num"));

		if (attempt == 1 && correctAnswers == 0 && thisObj.data("num") == 7) {
			correctAnswers++;
		}
		if (attempt == 2 && correctAnswers == 1 && thisObj.data("num") == 9) {
			correctAnswers++;
		}
		if (attempt == 3 && correctAnswers == 2 && (thisObj.data("num") == 5 || thisObj.data("num") == 8)) {
			correctAnswers++;
		}
		if (attempt == 4 && correctAnswers == 3 && (thisObj.data("num") == 4 || thisObj.data("num") == 11)) {
			correctAnswers++;
		}
		if (attempt == 5 && correctAnswers == 4 && (thisObj.data("num") == 4 || thisObj.data("num") == 11)) {
			correctAnswers++;
		}
		if (attempt == 6 && correctAnswers == 5 && thisObj.data("num") == 3) {
			correctAnswers++;
		}
		if (attempt == 7 && correctAnswers == 6 && thisObj.data("num") == 2) {
			correctAnswers++;
		}
		if (attempt == 8 && correctAnswers == 7 && (thisObj.data("num") == 5 || thisObj.data("num") == 8)) {
			document.getElementById("answer").innerHTML = "#10191";
		}
		attempt++;

	}
};


</script>
