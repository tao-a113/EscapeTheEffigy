<!DOCTYPE html>
<html>

<head>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="javascript.js"></script>
    <link rel="stylesheet" href="stylesheet.css">

    <title>The Effigy - Escape Room v1.0</title>
</head>

<style>
#computerCoreBody  {
  background-image: url("images/computerCore.jpg");
  background-repeat: no-repeat;
  position: absolute;
  background-size: cover;
  height: 770px; width:1250px;
  user-select: none;
}
.buttons:focus {
  outline: none;
  box-shadow: none;
}

.buttons:hover  {
    -webkit-filter: drop-shadow(2px 1px 0 yellow)
    				  drop-shadow(-1px -1px 0 yellow);
    filter: drop-shadow(2px 1px 0 yellow)
  		  drop-shadow(-1px -1px 0 yellow);
}
</style>

<script>

$( document ).ready(function() {

var role = localStorage.getItem("role");

	$('#button1').click(function(){
	
		document.getElementById("roomResponseText").innerText = "";
		if (role == "Passenger") {
			var text = "A terminal for the computer core. Your answer is hidden to you. But maybe others can help.";
			popupWindow = window.open(
				"popups/popupComputerCoreTerminal.html",'popUpWindow','height=650,width=700,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
			)
		} else {
			var text = "This terminal cannot be accessed by any staff of the ship.";
		}
		setTypeWriter();
		typeWriter (text);
	});

	$('#button2').click(function(){
	
		document.getElementById("roomResponseText").innerText = "";
		if (role == "Officer") {
			var text = "A terminal for the computer core. Your answer is hidden to you. But maybe others can help.";
			popupWindow = window.open(
				"popups/popupComputerCoreTerminal.html",'popUpWindow','height=650,width=700,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
			)
		} else {
			var text = "This terminal can only be accessed by an officer of the Effigy.";
		}
		setTypeWriter();
		typeWriter (text);
	});
	
	$('#button3').click(function(){
	
		document.getElementById("roomResponseText").innerText = "";
		if (role == "Engineer") {
			var text = "A terminal for the computer core. Your answer is hidden to you. But maybe others can help.";
			popupWindow = window.open(
				"popups/popupComputerCoreTerminal.html",'popUpWindow','height=650,width=700,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
			)
		} else {
			var text = "This terminal can only be accessed by an engineer of the ship.";
		}
		setTypeWriter();
		typeWriter (text);
	});
});
</script>
<body>
	<div id="computerCoreBody">
		<input id="button1" class="buttons" type="image" src="images/computerCoreButton1.png" style="top:195px; left:535px; height:165px; width:100px; position:absolute;"/>
		<input id="button2" class="buttons" type="image" src="images/computerCoreButton2.png" style="top:40px; left:636px; height:210px; width:280px; position:absolute"/>
		<input id="button3" class="buttons" type="image" src="images/computerCoreButton3.png" style="top:106px; left:960px; height:228px; width:152px; position:absolute;"/>
	</div>

	
	<div id="roomDescription" class="roomDescription">
		<p id="roomDescriptionText" style="width:370px; height:300px; margin-left:20px; margin-top:30px; top:47px; left:48px; position:relative;">
			You are at the core of the on-board computer. There are three terminals that link up to the shuttle bay doors. The computer will need to be overridden.
		</p>
	</div>

	<br><br>

	<div id="roomResponses" class="roomResponses">
		<p id="roomResponseText" style="width:360px; height:300px; margin-left:20px; margin-top:30px; top:80px; left:63px; position:relative;"></p>
	</div>
		
</body>
	<div class="console">
		<input style="margin-top:40px; margin-left:40px" type="text" class="consoleText">
		<input style="margin-top:40px;" type="submit" value="Update System" class="consoleButton">
		<input style="margin-top:10px; height:70px; width:600px; margin-left:70px" type="textarea" id="consoleArea">
	</div>
</html>
