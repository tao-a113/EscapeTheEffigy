<!DOCTYPE html>
<html>

<head>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="javascript.js"></script>
    <link rel="stylesheet" href="stylesheet.css">

    <title>The Effigy - Escape Room v1.0</title>
</head>

<style>
#centralCorridorBody  {
  background-image: url("images/hallway.png");
  background-repeat: no-repeat;
  position: absolute;
  background-size: cover;
  height: 770px; width:1250px;
}
#centralCorridorBody2  {
  background-image: url("images/hallway_2.png");
  background-repeat: no-repeat;
  position: absolute;
  background-size: cover;
  height: 770px; width:1250px;
  clip-path:url(#clip);
}
.buttons:focus {
  outline: none;
  box-shadow: none;
}
.a {
  opacity:0.4;
}

.buttons:hover  {
    -webkit-filter: drop-shadow(2px 1px 0 yellow)
    				  drop-shadow(-1px -1px 0 yellow);
    filter: drop-shadow(2px 1px 0 yellow)
  		  drop-shadow(-1px -1px 0 yellow);
}


</style>
<script>

window.onload = function(){

	// clear
	$('#button1').click(function(){
	
			document.getElementById("roomResponseText").innerText = "";
			var text = "You find a hidden compartment in the wall.";
			setTypeWriter();
			typeWriter (text);
			
			popupWindow = window.open(
				"popups/popupHiddenCompartment.html",'popUpWindow','height=800,width=800,left=50,top=50,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
			)
	});
};
	
let cursor = document.getElementById("lo");
let circle = document.getElementById("circle");

let setCursorPosition = function(e) {
			console.log ("hi");
			var circle = document.getElementById("circle");

			circle.setAttribute('cx',e.clientX);
			circle.setAttribute('cy',e.clientY);
			};


document.addEventListener("mousemove", e => setCursorPosition(e));

	function isKeyPressed(event) {
	
		var gotBlackLight = localStorage.getItem("gotBlacklight");
		if (event.shiftKey && gotBlackLight == "true") {
			$("#lo").toggle ();
			$("#centralCorridorBody2").toggle ();
			$("#centralCorridorBody").toggleClass( "a" );
			
			$("#graf2").toggle ();
			
		}

	}

</script>
<body onkeyup="isKeyPressed(event)">


	
		<div id="centralCorridorBody">
			<img src="images/wallpaper.png" id="graf1" style="top:370px; left:240px; height:100px; width:100px; position:absolute;">
			
		</div>

		<div id="centralCorridorBody2" style="display:none;">
			<img src="images/wallpaper2.png" id="graf2" style="top:370px; left:240px; height:125px; width:115px; display:none; position:absolute;">
			<input id="button1" class="buttons" type="image" src="images/hallwayButton1.png" style="top:170px; left:930px; height:70px; width:100px; position:absolute"/>
			<svg id="lo" width="100%" height="100%" style="display:none;">
				<clippath id="clip">
					<circle id="circle" cx="50" cy="50" r="50"/>
				</clippath>
			</svg>
		
		</div>
		
					
		


	<div id="roomDescription" class="roomDescription">
		<p id="roomDescriptionText" style="width:370px; height:300px; margin-left:20px; margin-top:30px; top:47px; left:48px; position:relative;">
			You are on the ships central corridor.
		</p>
	</div>

	<br><br>

	<div id="roomResponses" class="roomResponses">
		<p id="roomResponseText" style="width:360px; height:300px; margin-left:20px; margin-top:30px; top:80px; left:63px; position:relative;"></p>
	</div>
</body>
	<div class="console">
		<input style="margin-top:40px; margin-left:40px" type="text" class="consoleText">
		<input style="margin-top:40px;" type="submit" value="Update System" class="consoleButton">
		<input style="margin-top:10px; height:70px; width:600px; margin-left:70px" type="textarea" id="consoleArea">
	</div>
</html>
