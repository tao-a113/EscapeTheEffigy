	function changeRoom(room) {

		sessionStorage.setItem("previousRoom", sessionStorage.getItem("room"));

		if (room == "bridgeRoom") {
			$(".rooms").hide();
			$("#elevatorRoomAccess").show();
			sessionStorage.setItem("room", "bridge");
		}
		if (room == "elevatorRoom") {
			$(".rooms").hide();
			$("#bridgeRoomAccess").show();
			$("#upperCorridorRoomAccess").show();
			sessionStorage.setItem("room", "elevatorRoom");
		}
		if (room == "suitRoom") {
			$(".rooms").hide();
			$("#upperCorridorRoomAccess").show();
			sessionStorage.setItem("room", "suitRoom");
		}
		if (room == "upperCorridorRoom") {
			$(".rooms").hide();
			$("#elevatorRoomAccess").show();
			$("#suitRoomAccess").show();
			$("#officersQuartersRoomAccess").show();
			sessionStorage.setItem("room", "upperCorridorRoom");
		}
		if (room == "officersQuartersRoom") {

			$("#upperCorridorRoomAccess").show();
			$("#shuttleBayCorridorRoomAccess").show();
			
			sessionStorage.setItem("room", "officersQuartersRoom");
		}
		if (room == "engineRoom") {

			$("#lowerCorridorRoomAccess").show();
			sessionStorage.setItem("room", "engine");

		if (room == "lowerCorridorRoom") {

		if (room == "powerGeneratorRoom") {

			$("#lowerCorridorRoomAccess").show();
			$("#shuttleBayCorridorRoomAccess").show();
			sessionStorage.setItem("room", "powerGeneratorRoom");
		}
		if (room == "lifeSupportRoom") {

			var a = localStorage.getItem("lifeSupportUnlocked");

			if (a != "true") {

				document.getElementById("mainFrame").contentWindow.document.getElementById("roomResponseText").innerText = "";

			}


			$(".rooms").hide();
			$("#lowerCorridorRoomAccess").show();
			sessionStorage.setItem("room", "lifeSupportRoom");
		}
		if (room == "chomperRoom") {
			$(".rooms").hide();

			$("#computerCoreRoomAccess").show();
			sessionStorage.setItem("room", "chomperRoom");
		}
		if (room == "computerCoreRoom") {
			$(".rooms").hide();
			$("#chomperRoomAccess").show();
			sessionStorage.setItem("room", "computerCoreRoom");
		}
		if (room == "cabinRoom") {
			$(".rooms").hide();
			$("#centralCorridorRoomAccess").show();
			sessionStorage.setItem("room", "cabin");
		}
		if (room == "centralCorridorRoom") {
			$(".rooms").hide();
			$("#cabinRoomAccess").show();
			$("#medicalBayRoomAccess").show();
			$("#airLockRoomAccess").show();
			$("#cargoBayRoomAccess").show();
			sessionStorage.setItem("room", "centralCorridorRoom");
		}
		if (room == "medicalBayRoom") {
			$(".rooms").hide();
			$("#centralCorridorRoomAccess").show();
			sessionStorage.setItem("room", "medicalBayRoom");
		}
		if (room == "airLockRoom") {
			$(".rooms").hide();
			$("#centralCorridorRoomAccess").show();
			sessionStorage.setItem("room", "airLockRoom");
		}
		if (room == "outsideRoom") {
			$(".rooms").hide();
			sessionStorage.setItem("room", "outsideRoom");
		}
		if (room == "cargoBayRoom") {
			$(".rooms").hide();
			$("#centralCorridorRoomAccess").show();
			$("#shuttleBayCorridorRoomAccess").show();
			sessionStorage.setItem("room", "cargoBayRoom");
		}
		if (room == "shuttleBayCorridorRoom") {


			var suit = localStorage.getItem("isWearingSuit");
			var condition = localStorage.getItem("shuttleBayRoomCondition");

			if (condition == "fixed") {

				$(".rooms").hide();
				$("#cargoBayRoomAccess").show();
				$("#officersQuartersRoomAccess").show();
				$("#powerGeneratorRoomAccess").show();
				$("#shuttleRoomAccess").show();
				localStorage.setItem("room", "shuttleBayCorridorRoom");

			} else if (suit != "true" && condition == "noOxygen"){

				document.getElementById("mainFrame").contentWindow.document.getElementById("roomResponseText").innerText = "";
				var text = "This room seems to be depressurised completely. You will need to be in a space suit or the room needs to be repressurised with oxygen.";
				setTypeWriter();
				typeWriterChild (text);
				return;

			} else if (suit != "true" && condition != "fixed"){

				document.getElementById("mainFrame").contentWindow.document.getElementById("roomResponseText").innerText = "";
				var text = "This room seems to be depressurised completely. You will need to be in a space suit to enter here.";
				setTypeWriter();
				typeWriterChild (text);
				return;

			} else if (suit == "true" && condition != "fixed") {

				$(".rooms").hide();
				$("#shuttleRoomAccess").show();
				$("#officersQuartersRoomAccess").show();
				sessionStorage.setItem("room", "shuttleBayCorridorRoom");
			}

		}
		if (room == "shuttleRoom") {
			$(".rooms").hide();
			$("#shuttleBayCorridorRoomAccess").show();
			sessionStorage.setItem("room", "shuttleRoom");
		}
		console.log ("you are now in the " + room);
        loadDeferredIframe (room);
    };

    function loadDeferredIframe(room) {

        var iframe = document.getElementById("mainFrame");
        iframe.src = "./" + room + ".html";
		iframe.focus ();

<script>

const audioContext = new AudioContext();

async function playLoop(url, crossfadeSeconds = 3) {
  const response = await fetch(url, {mode: 'no-cors'});
  const arrayBuffer = await response.arrayBuffer();
  const buffer = await audioContext.decodeAudioData(arrayBuffer);

  const duration = buffer.duration;

  function createSource(startTime, offset, gainStart, gainEnd) {
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();

    source.buffer = buffer;
    source.connect(gain);
    gain.connect(audioContext.destination);

    gain.gain.setValueAtTime(gainStart, startTime);
    gain.gain.linearRampToValueAtTime(gainEnd, startTime + crossfadeSeconds);

    source.start(startTime, offset);

    return source;
  }

  // Start the first copy at full volume.
  let nextStart = audioContext.currentTime + 0.05;

  let source = audioContext.createBufferSource();
  let gain = audioContext.createGain();

  source.buffer = buffer;
  source.connect(gain);
  gain.connect(audioContext.destination);
  gain.gain.setValueAtTime(1, nextStart);
  source.start(nextStart);

  while (true) {
    // Start the next copy slightly before the previous one ends.
    const nextLoopStart =
      nextStart + duration - crossfadeSeconds;

    const nextSource = audioContext.createBufferSource();
    const nextGain = audioContext.createGain();

    nextSource.buffer = buffer;
    nextSource.connect(nextGain);
    nextGain.connect(audioContext.destination);

    // New copy fades in.
    nextGain.gain.setValueAtTime(0, nextLoopStart);
    nextGain.gain.linearRampToValueAtTime(
      1,
      nextLoopStart + crossfadeSeconds
    );

    // Current copy fades out.
    gain.gain.setValueAtTime(1, nextLoopStart);
    gain.gain.linearRampToValueAtTime(
      0,
      nextLoopStart + crossfadeSeconds
    );

    nextSource.start(nextLoopStart);

    source = nextSource;
    gain = nextGain;
    nextStart = nextLoopStart;

    // Don't actually use an infinite synchronous loop!
    // Scheduling must happen asynchronously.
    await new Promise(resolve =>
      setTimeout(resolve, (duration - crossfadeSeconds) * 1000)
    );
  }
}
