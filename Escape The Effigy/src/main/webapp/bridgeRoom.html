<!DOCTYPE html>
<html>

<head>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="javascript.js"></script>
    <link rel="stylesheet" href="stylesheet.css">

    <title>The Effigy - Escape Room v1.0</title>
</head>

<style>
#bridgeBody  {
  background: linear-gradient( rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.95) ), url("images/bridge.jpg");
  background-repeat: no-repeat;
  height: 850px; width:1250px;
  position: absolute;
}

.buttons:focus {
  outline: none;
  box-shadow: none;
}

.buttons:hover  {
    -webkit-filter: drop-shadow(2px 1px 0 yellow)
    				  drop-shadow(-1px -1px 0 yellow);
    filter: drop-shadow(2px 1px 0 yellow)
  		  drop-shadow(-1px -1px 0 yellow);
}
</style>

<script>
$( document ).ready(function() {
	$('#button1').bind('click', function(){

		if (checkButton ($(this))) {
			return;
		}
	
		document.getElementById("roomResponseText").innerText = "";

		var text = "These controls connect to a nearby teleport pad for recieving only. There is nothing here";
		
		if (localStorage.getItem("isToolsTransported") == "true" && localStorage.getItem("gotTools") == "false") {
			var text = "These controls connect to a nearby teleport pad for recieving only. There are some tools for fixing holes in the ship here which you take.";
			localStorage.setItem("gotTools", "true");
		}
		
		setTypeWriter();
		typeWriter (text);

	});

	$('#button2').click(function(){

		if (checkButton ($(this))) {
			return;
		}
	
		document.getElementById("roomResponseText").innerText = "";
		var text = "Power levels are shown here";
		setTypeWriter();
		typeWriter (text);

		popupWindow = window.open(
			"popups/popupDamageLog.html",'popUpWindow','height=600,width=800,left=50,top=50,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)

	});
	$('#button4').click(function(){

		if (checkButton ($(this))) {
			return;
		}
	
		document.getElementById("roomResponseText").innerText = "";
		var text = "Emergency prcedures";
		setTypeWriter();
		typeWriter (text);

		popupWindow = window.open(
			"popups/popupInstructions.html",'popUpWindow','height=600,width=600,left=500,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
		
	});

	$('#button3').click(function(){

		document.getElementById("roomResponseText").innerText = "";
		var text = "Complete the circuit to switch on the lights.";
		setTypeWriter();
		typeWriter (text);

		popupWindow = window.open(
			"popups/popupLightingWires.html",'popUpWindow','height=455,width=430,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
	});
	
	function checkButton(obj) {
		if (obj.hasClass("darkenedButtons")){
			document.getElementById("roomResponseText").innerText = "";
			var text = "It's too dark to use this right now.";
			setTypeWriter();
			typeWriter (text);
			return true;
		}
	}
	
});
</script>

<body>
	<div id="bridgeBody">
		<input id="button1" class="buttons darkenedButtons" type="image" src="images/bridgeButton1.png" style="margin-left:20px; margin-top:20px; top:510px; left:925px; position:absolute; "/>
		<input id="button2" class="buttons darkenedButtons" type="image" src="images/bridgeButton2.png" style="top:370px; position:absolute"/>
		<input id="button3" class="buttons darkenedButtons" type="image" src="images/bridgeButton3.png" style="top:400px; left:500px; position:absolute"/>
		<input id="button4" class="buttons darkenedButtons" type="image" src="images/bridgeButton4.png" style="top:445px; left:900px; position:absolute"/>
	</div>

	<div id="roomDescription" class="roomDescription">
		<p id="roomDescriptionText" style="width:370px; height:300px; margin-left:20px; margin-top:30px; top:47px; left:48px; position:relative;">
			You are on the bridge of the ship. The electronics crackle as live wires have been ripped from the machines.  Many of the ship controls have been badly damaged.
		</p>
	</div>

	<br><br>

	<div id="roomResponses" class="roomResponses">
		<p id="roomResponseText" style="width:360px; height:300px; margin-left:20px; margin-top:30px; top:80px; left:63px; position:relative;"></p>
	</div>
</body>
	<div class="console">
		<input style="margin-top:40px; margin-left:40px" type="text" class="consoleText">
		<input style="margin-top:40px;" type="submit" value="Update System" class="consoleButton">
		<input style="margin-top:10px; height:70px; width:600px; margin-left:70px" type="textarea" id="consoleArea">
	</div>
</html>
