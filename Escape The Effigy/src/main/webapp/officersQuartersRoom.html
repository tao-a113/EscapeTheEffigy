<!DOCTYPE html>
<html>

<head>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="javascript.js"></script>
    <link rel="stylesheet" href="stylesheet.css">

    <title>The Effigy - Escape Room v1.0</title>
</head>

<script>
$( document ).ready(function() {

	$('#button3').click(function(){
		document.getElementById("roomResponseText").innerText = "";
		var text = "You start to feel a bit sleepy. A quick nap can't hurt..";
		setTypeWriter();
		typeWriter (text);

		parent.document.getElementById("upperCorridorRoomAccess").style.display = 'none';
		parent.document.getElementById("shuttleBayCorridorRoomAccess").style.display = 'none';

		document.getElementById("officersQuartersBody").classList.add("faded");
		$("#myProgress").fadeIn(3000);
		document.getElementById("button1").style.display = "none";
		document.getElementById("button2").style.display = "none";
		document.getElementById("button3").style.display = "none";
		document.getElementById("button4").style.display = "none";
		move ();
	});

	function wakeUp () {
		parent.document.getElementById("upperCorridorRoomAccess").style.display = 'block';
		parent.document.getElementById("shuttleBayCorridorRoomAccess").style.display = 'block';

		document.getElementById("officersQuartersBody").classList.remove("faded");
		$("#myProgress").fadeOut(3000);
		document.getElementById("button1").style.display = "block";
		document.getElementById("button2").style.display = "block";
		document.getElementById("button3").style.display = "block";
		document.getElementById("button4").style.display = "block";

		document.getElementById("roomResponseText").innerText = "";
		var text = "You wake up feeling refreshed";
		setTypeWriter();
		typeWriter (text);
	}

var i = 0;
function move() {
  if (i == 0) {
    i = 1;
    var elem = document.getElementById("sleepingBar");
    var width = 10;
    var id = setInterval(frame, 500);
    function frame() {
      if (width >= 100) {
      wakeUp();
        clearInterval(id);
        i = 0;
      } else {
        width++;
        elem.style.width = width + "%";
      }
    }
  }
}

$('#button2').click(function(){

		document.getElementById("roomResponseText").innerText = "";
		var text = "Theres some diagrams in here for the ships engine";
		setTypeWriter();
		typeWriter (text);

		popupWindow = window.open(
			"popups/popupEngine_off.html",'popUpWindow','height=800,width=800,left=50,top=50,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
});

	$('#button1').click(function(){
		document.getElementById("roomResponseText").innerText = "";
		var text = "You open up the captains personal computer";
		setTypeWriter();
		typeWriter (text);

		popupWindow = window.open(
			"popups/popupCaptainsComputer.html",'popUpWindow','height=800,width=800,left=50,top=50,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
	});
	
	$('#button4').click(function(){
		document.getElementById("roomResponseText").innerText = "";
		var text = "Some of the captains books";
		setTypeWriter();
		typeWriter (text);

		popupWindow = window.open(
			"popups/popupBooks2.html",'popUpWindow','height=800,width=800,left=50,top=50,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
	});

});
</script>

<style>
#officersQuartersBody  {
  background-image: url("images/officersQuarters.jpg");
  background-repeat: no-repeat;
  position: absolute;
  background-size: cover;
  height: 770px; width:1250px;
    transition: opacity 3s ease-in-out;
    -moz-transition: opacity 3s ease-in-out;
    -webkit-transition: opacity 3s ease-in-out;

}
.faded {
  opacity:0;
}
.buttons:focus {
  outline: none;
  box-shadow: none;
}

.buttons:hover  {
    -webkit-filter: drop-shadow(2px 1px 0 yellow)
    				  drop-shadow(-1px -1px 0 yellow);
    filter: drop-shadow(2px 1px 0 yellow)
  		  drop-shadow(-1px -1px 0 yellow);
}

#sleepingBar {
  width: 10%;
  height: 30px;
  background-color: #4CAF50;
  text-align: center; /* To center it horizontally (if you want) */
  line-height: 30px; /* To center it vertically */
  color: white;
}

#myProgress {
  width: 600px%;
  background-color: grey;
  left:320px; top:350px; position:absolute;
  width:600px;
  display:none;
}

#sleepingBar {
  width: 1%;
  height: 30px;
  background-color: green;
}
</style>

<body>
	<div id="officersQuartersBody">
		<input id="button1" class="buttons" type="image" src="images/officersQuartersButton1.png" style="top:527px; left:525px; height:90px; width:250px; position:absolute"/>
		<input id="button2" class="buttons" type="image" src="images/officersQuartersButton2.png" style="top:246px; left:1px; height:195px; width:120px; position:absolute"/>
		<input id="button3" class="buttons" type="image" src="images/officersQuartersButton3.png" style="top:313px; left:415px; height:110px; width:400px; position:absolute"/>
		<input id="button4" class="buttons" type="image" src="images/officersQuartersButton4.png" style="top:355px; left:1132px; height:110px; width:120px; position:absolute"/>
	</div>

	<div id="myProgress">
		<div id="sleepingBar">
		</div>
	</div>
	<div id="roomDescription" class="roomDescription">
		<p id="roomDescriptionText" style="width:370px; height:300px; margin-left:20px; margin-top:30px; top:47px; left:48px; position:relative;">
			You are in the captains quarters. He sure did keep a tidy cabin. Maybe theres some important information on the ship in here.
		</p>
	</div>

	<br><br>

	<div id="roomResponses" class="roomResponses">
		<p id="roomResponseText" style="width:360px; height:300px; margin-left:20px; margin-top:30px; top:80px; left:63px; position:relative;"></p>
	</div>
</body>
	<div class="console">
		<input style="margin-top:40px; margin-left:40px" type="text" class="consoleText">
		<input style="margin-top:40px;" type="submit" value="Update System" class="consoleButton">
		<input style="margin-top:10px; height:70px; width:600px; margin-left:70px" type="textarea" id="consoleArea">
	</div>
</html>
