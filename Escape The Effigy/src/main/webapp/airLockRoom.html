<!DOCTYPE html>
<html>

<head>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="javascript.js"></script>
    <link rel="stylesheet" href="stylesheet.css">

    <title>The Effigy - Escape Room v1.0</title>
</head>

<style>
#airlockBody  {
  background-image: url("images/airlock.png");
  background-repeat: no-repeat;
  height: 850px; width: 1250px;
  background-size: cover;
  position: absolute;
      transition: opacity 3s ease-in-out;
    -moz-transition: opacity 3s ease-in-out;
    -webkit-transition: opacity 3s ease-in-out;
}

.faded {
  opacity:0;
}

.buttons:focus {
  outline: none;
  box-shadow: none;
}

.buttons:hover  {
    -webkit-filter: drop-shadow(2px 1px 0 yellow)
    				  drop-shadow(-1px -1px 0 yellow);
    filter: drop-shadow(2px 1px 0 yellow)
  		  drop-shadow(-1px -1px 0 yellow);
}

#sleepingBar {
  width: 1%;
  height: 30px;
  background-color: #4CAF50;
  text-align: center; /* To center it horizontally (if you want) */
  line-height: 30px; /* To center it vertically */
  color: green;
}

#myProgress {
  width: 600px%;
  background-color: grey;
  left:320px; top:350px; position:absolute;
  width:600px;
  display:none;
}

</style>

<script>

$( document ).ready(function() {
	
	$('#button1').click(function(){
	
		var suit = localStorage.getItem("isWearingSuit");
		
		if (suit != "true") {
		
			document.getElementById("roomResponseText").innerText = "";
			var text = "You probably don't want to exit the airlock until you are wearing a vac suit.";
			setTypeWriter();
			typeWriter (text);
			return;
		}
	
		document.getElementById("roomResponseText").innerText = "";
		var text = "De-pressurising...";
		setTypeWriter();
		typeWriter (text);

		parent.document.getElementById("centralCorridorRoomAccess").style.display = 'none';

		document.getElementById("airlockBody").classList.add("faded");
		$("#myProgress").fadeIn(3000);
		document.getElementById("button1").style.display = "none";
		move ();
	});
	
	$('#button2').click(function(){
		
		document.getElementById("roomResponseText").innerText = "";
		var text = "Looks like a picture";
		setTypeWriter();
		typeWriter (text);
		popupWindow = window.open(
			"popups/popupHorsePic.html",'popUpWindow','height=650,width=700,left=300,top=200,resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no,status=yes'
		)
		
	});

	var i = 0;
	function move() {
	  if (i == 0) {
		i = 1;
		var elem = document.getElementById("sleepingBar");
		var width = 1;
		var id = setInterval(frame, 150);
		function frame() {
		  if (width >= 100) {
			clearInterval(id);
			i = 0;
			
			if (prevRoom == "outsideRoom") {
				$("#myProgress").fadeOut(2000);
				$("#airlockBody").fadeIn (1000);
				document.getElementById("airlockBody").classList.remove("faded");
				$("#button1").fadeIn (1000);
				parent.document.getElementById("centralCorridorRoomAccess").style.display = 'block';
				return;
			}
			
			parent.changeRoom ("outsideRoom");
			
		  } else {
			width++;
			elem.style.width = width + "%";
		  }
		}
	  }
	}
	
	var prevRoom = sessionStorage.getItem("previousRoom");
	if (prevRoom == "outsideRoom") {
		document.getElementById("roomResponseText").innerText = "";
		var text = "Pressurising...";
		setTypeWriter();
		typeWriter (text);

		parent.document.getElementById("centralCorridorRoomAccess").style.display = 'none';
		document.getElementById("airlockBody").style.display = "none";
		document.getElementById("airlockBody").classList.add("faded");
		
		$("#myProgress").fadeIn(3000);
		document.getElementById("button1").style.display = "none";
		move ();
	}
		
});
</script>
<body>

	<div id="airlockBody">
		<input id="button1" class="buttons" type="image" src="images/airlockButton1.png" style="width:50px; height:60px; top:410px; left:505px; position:absolute;"/>
		<input id="button2" class="buttons" type="image" src="images/horseButton.png" style="width:50px; height:50px; top:410px; left:415px; position:absolute;"/>
	</div>
	
	<div id="myProgress">
		<div id="sleepingBar">
		</div>
	</div>

	<div id="roomDescription" class="roomDescription">
		<p id="roomDescriptionText" style="width:370px; height:300px; margin-left:20px; margin-top:30px; top:47px; left:48px; position:relative;">
			You are in the airlock. You can depressurize this whole area and exit to the outside of the ship.
		</p>
	</div>

	<br><br>

	<div id="roomResponses" class="roomResponses">
		<p id="roomResponseText" style="width:360px; height:300px; margin-left:20px; margin-top:30px; top:80px; left:63px; position:relative;"></p>
	</div>
</body>
	<div class="console">
		<input style="margin-top:40px; margin-left:40px" type="text" class="consoleText">
		<input style="margin-top:40px;" type="submit" value="Update System" class="consoleButton">
		<input style="margin-top:10px; height:70px; width:600px; margin-left:70px" type="textarea" id="consoleArea">
	</div>
</html>
