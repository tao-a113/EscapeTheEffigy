<head>
</head>
<style>
@font-face { font-family: Digital7; src: url('digital-7/digital-7.ttf'); } 
</style>
<script>

window.onload = function(){

var sounds = [];
var phase = 1;
var off = true;

	$('#record').click(function(){
		if (off) {
			$(this).attr('src','../images/recordButtonOn.png');
		} else {
			$(this).attr('src','../images/recordButtonOff.png');
		}
		off = !off;
	});
	
	$('.button').click(function(){
		var id = $(this).attr('id');
		var beep;
				
		switch (id) {
			case ("button0") : beep = new Audio('../sounds/beep0.wav'); break;
			case ("button1") : beep = new Audio('../sounds/beep1.wav'); break;
			case ("button2") : beep = new Audio('../sounds/beep2.wav'); break;
			case ("button3") : beep = new Audio('../sounds/beep3.wav'); break;
			case ("button4") : beep = new Audio('../sounds/beep4.wav'); break;
			case ("button5") : beep = new Audio('../sounds/beep5.wav'); break;
			case ("button6") : beep = new Audio('../sounds/beep6.wav'); break;
			case ("button7") : beep = new Audio('../sounds/beep7.wav'); break;
			case ("button8") : beep = new Audio('../sounds/beep8.wav'); break;
			case ("button9") : beep = new Audio('../sounds/beep9.wav'); break;
			case ("button10") : beep = new Audio('../sounds/beep10.wav'); break;
			case ("button11") : beep = new Audio('../sounds/beep11.wav'); break;
			case ("button12") : beep = new Audio('../sounds/beep12.wav'); break;
			case ("button13") : beep = new Audio('../sounds/beep13.wav'); break;
			case ("button14") : beep = new Audio('../sounds/beep14.wav'); break;
		}
		beep.play();
		if (!off) {
			addSound (id);
		}
	});

	function addSound (id) {
	
		var num = id.substr(6);
		var column = $('<td id='+num+' style="width:50px;">'+ num +'</td>'); 
		
		$('#soundTable tr').append(column);
		sounds.push (num);
	}
	
	$('#play').click(function(){
	
		var audio = new Audio();
		i = 0;
		var playlist = new Array();

		for (j=0; j<sounds.length; j++) {		
			var sound = sounds[j];
			playlist.push ('../sounds/beep'+sound+'.wav');
		}
		
		audio.onended = (event) => {
		
			if (i < playlist.length) {
				i = ++i;
				audio.src = playlist[i];
				audio.play();
			}
			if (i == playlist.length) {
				if (sounds[0] == 8 && sounds[1] == 9 && sounds[2] == 7 && sounds[3] == 0 && sounds[4] == 4 && sounds.length == 5 && phase == 1) {
					
					nextPhase ();
					
				}
			}
		};
		
		audio.loop = false;
		audio.src = playlist[0];
		audio.play();
	});
	
	$('#clear').click(function(){
		var i;
		for (i = 0; i<sounds.length; i++) {
			var sound = sounds[i];
			$('#soundTable tr td#' + sound).remove();    
		}
		sounds = [];
	});
	
	function nextPhase () {
		$('.button').hide ();
		$('#keypad').hide ();
		$('#clear').hide ();
		$('#play').hide ();
		$('#soundTable').hide ();
		$('#record').hide ();
		sounds = [];
		
		$('#musicPanel1').show ();
		$('#musicPanel2').show ();
		$('#musicPanel3').show ();
		$('.button2').show ();
		$('#answer').show ();
		
	}
	
		$('.button2').click(function(){
		
			var audio = new Audio();
			i = 0;
			var playlist = new Array();

			
			// 0 9 8 9 10 7
			playlist.push ('../sounds/beep0.wav');
			playlist.push ('../sounds/beep9.wav');
			playlist.push ('../sounds/beep8.wav');
			playlist.push ('../sounds/beep9.wav');
			playlist.push ('../sounds/beep10.wav');
			playlist.push ('../sounds/beep7.wav');
		
			audio.onended = (event) => {
		
				if (i < playlist.length) {
					i = ++i;
					audio.src = playlist[i];
					audio.play();
				}
			};
			audio.loop = false;
			audio.src = playlist[0];
			audio.play();
		});
	
};
</script>

	<input type="button" id="button6" class="button" style="width:80px; height:80px; position:absolute; left:470px; top:355px; background:transparent; font-size:0;">
	
	<input type="button" id="button7" class="button" style="width:80px; height:80px; position:absolute; left:213px; top:270px; background:transparent; font-size:0;">
	<input type="button" id="button8" class="button" style="width:80px; height:80px; position:absolute; left:298px; top:270px; background:transparent; font-size:0;">
	<input type="button" id="button9" class="button" style="width:80px; height:80px; position:absolute; left:383px; top:270px; background:transparent; font-size:0;">
