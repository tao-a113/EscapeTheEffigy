<!DOCTYPE html>
<html>

<head>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.2.0/lib/p5.js"></script>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <title>The Effigy - Escape Room v1.0</title>
</head>

<style>
</style>

<script>
var beakerFilled = 0;
var beaker = [];

window.onload = function(){

	$('.buttons').click(function(){

		beakerFilled = beakerFilled+1;

		var drug = $(this).data("drug");
		beaker.push(drug);

	});

	// clear
	$('#button1').click(function(){
		beakerFilled = 0;
		beaker = [];
		document.getElementById("answer").innerHTML = "";
	});

	// mix
	$('#button2').click(function(){


		if (beakerFilled > 3) {

			var a = countInArray ("A");
			var b = countInArray ("B");
			var c = countInArray ("C");
			var d = countInArray ("D");
			var e = countInArray ("E");
			var f = countInArray ("F");
			
			var drugName;

			if (f == 1 && e == 2 && b == 1) {
				drugName = "ratchecroxide";
			} else if (a == 2 && c == 2) {
				drugName = "salty water";
			} else if (f == 1 && d == 1 && c == 2) {
				drugName = "mandalope paste";
			} else {
				drugName = getWrongAnswer ();
			}
			if (document.getElementById("answer").innerHTML.trim() == "") {
				document.getElementById("answer").innerHTML = drugName;
			}
		}

	});

	function countInArray(what) {
		var count = 0;
		for (var i = 0; i < beaker.length; i++) {
			if (beaker[i] === what) {
				count ++;
			}
		}
		return count;
	}

	function getWrongAnswer() {
		var answers = [
		"Bardobloxin",
		"Jamonuroxide",
		"Mega-nurofen",
		"Garbloniun Sulphate",
		"Mistaxofonate",
		"Drabbostopside",
		"Inklecetamol",
		"razmatazorphox",
		"kerplunkomace",
		"Jelluphanmine XXi",
		];

		return answers[Math.floor(Math.random() * answers.length)]
	}
};

function setup() {
  let canvas = createCanvas(400, 400);
  canvas.position(50, 50, 'fixed');
}

function draw() {

	stroke('black');
	fill ('black');
	rect(80, 100, 240, 360);
	
	stroke('white');
  	strokeWeight(5);
  	push();
	line(80, 100, 80, 360);
	line(80, 360, 320, 360);
	line(320, 360, 320, 100);
	pop();

	strokeWeight(1);
	fill ('aqua');
	if (beakerFilled == 1) {
		rect(80, 330, 240, 30);
	}
	if (beakerFilled == 2) {
		rect(80, 300, 240, 60);
	}
	if (beakerFilled == 3) {
		rect(80, 270, 240, 90);
	}
	if (beakerFilled > 3) {
		rect(80, 240, 240, 120);
	}

}

</script>

<body style="background-color:black; font-family:Digital7; color:black;font-size:18pt;">

		<input type="image" class="buttons" data-drug="A" src="../images/bottle1.png" style="width:5%; position:absolute; right:150px; top:20px;" title="Contains Water">
		<input type="image" class="buttons" data-drug="B" src="../images/bottle2.png" style="width:5%; position:absolute; right:150px; top:95px;" title="Contains Sulfur">
		<input type="image" class="buttons" data-drug="C" src="../images/bottle3.png" style="width:5%; position:absolute; right:150px; top:170px;" title="Contains Salt">
		<input type="image" class="buttons" data-drug="D" src="../images/bottle4.png" style="width:5%; position:absolute; right:150px; top:245px;" title="Contains Magnesium">
		<input type="image" class="buttons" data-drug="E" src="../images/bottle5.png" style="width:5%; position:absolute; right:150px; top:320px;" title="Contains Hydrogen Peroxide">
		<input type="image" class="buttons" data-drug="F" src="../images/bottle6.png" style="width:5%; position:absolute; right:150px; top:395px;" title="Contains Potassium">

	<p style="color:white; font-size:12pt; position:absolute; top:30px; right:230px;">Water</p>
	<p style="color:white; font-size:12pt; position:absolute; top:105px; right:230px;">Sulfur</p>
	<p style="color:white; font-size:12pt; position:absolute; top:180px; right:230px;">Salt</p>
	<p style="color:white; font-size:12pt; position:absolute; top:255px; right:230px;">Magnesium</p>
	<p style="color:white; font-size:12pt; position:absolute; top:330px; right:230px;">Hydrogen Peroxide</p>
	<p style="color:white; font-size:12pt; position:absolute; top:405px; right:230px;">Potassium</p>
	
	<input id="button1" type="button" value="clear" style="left:400px; top:500px; height:60px; width:120px; position:absolute;"/>
	<input id="button2" type="button" value="mix" style="left:200px; top:500px; height:60px; width:120px; position:absolute;"/>
	
	<div>
		<p id="answer" style="color:white; left:300px; top:580px; height:50px; width:100px; position:absolute;">
	</div>

</body>
