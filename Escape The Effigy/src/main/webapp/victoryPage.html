#fancy_h1_wrap
{
    display:block;
    width:100%;
    height:100%;
    position:absolute;
    top:100%;
}

<script>

$( document ).ready(function() {

var canvas = document.getElementById("icanvas");
var ctx = canvas.getContext("2d");

ctx.canvas.width  = window.screen.width
ctx.canvas.height = window.screen.height

var imgTag = new Image();
var x = 0;
var y = 100;

imgTag.onload = animate;
imgTag.src = "images/shipImage.png";   // load image


function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);  // clear canvas
 
  
  ctx.drawImage(imgTag, x, y, 20, 20);                       // draw image at current position
  x += .5;
  if (x < window.screen.width) requestAnimationFrame(animate)        // loop
}




function fun(){
$('#fancy_h1_wrap').css('top', '');
$('#fancy_h1_wrap').animate({top:"-400%"}, 60000, fun);
    
}

var tim = localStorage.getItem("timer");
    var h = Math.floor(tim / 3600);
    var m = Math.floor(tim % 3600 / 60);
    var s = Math.floor(tim % 3600 % 60);
	
	if (/^\d$/.test(h))  {h = "0" + h;}
	if (/^\d$/.test(m))  {m = "0" + m;}
	if (/^\d$/.test(s))  {s = "0" + s;}
	
$(".time").html ("Your total time was " + h + ":" + m + ":" + s);

var secret = localStorage.getItem("secretFound");
if (secret == "true") {
	$('.secret').html ("Secrets found 1/1")
}

fun();
});
</script>
